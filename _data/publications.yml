# Publications – additions and corrections
#
# Most publications come from the reference files in publications/ (RIS export
# from Zotero, EndNote, Mendeley, Citavi … or PubMed .nbib). This file is for
#
#  1. extra fields or corrections for an imported publication – match it by DOI:
#       - doi: 10.1124/pharmrev.124.001049
#         pmid: "39952686"        # direct PubMed link
#         openAccess: true        # "Open access" label
#         pdf: assets/pdf/x.pdf   # PDF button (or a full URL)
#         type: preprint          # article | preprint | conference | other
#         hide: true              # do not show this publication
#
#  2. publications that are not in a reference file (e.g. a poster) – give at
#     least type, year and title:
#       - type: conference
#         year: 2026
#         authors: Tremmel R, Schwab M
#         title: Title of the poster
#         venue: Conference name, City
#         details: Poster

- doi: 10.1124/pharmrev.124.001049
  pmid: "39952686"
